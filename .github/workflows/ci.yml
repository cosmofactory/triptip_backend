name: CI
run-name: Push to ${{ github.ref_name }} by @${{ github.actor }}

on:
  push

jobs:

  test_and_lint:
    runs-on: ubuntu-22.04
    services:
        postgres:
          image: postgres:14
          env:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: test_triptip
          ports:
            - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.1"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.12

      - name: Run test
        run: MODE=TEST uv run pytest --cov=src --cov-report=html:htmlcov  
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          ALGORITHM: ${{ secrets.ALGORITHM }}
          ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
          REFRESH_TOKEN_EXPIRE_DAYS: ${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          SERVICE_NAME: pytest
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          MODE: TEST
          COVERAGE_FILE: coverage/.coverage.${{ runner.os }}-py3.12.2
          CONTEXT: ${{ runner.os }}-py3.12.2

      - name: Run ruff
        run: uv run ruff check .

      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov
